[project]
name = "vpd-audit-2"
version = "0.1.0"
description = "Follow-up audit of the released VPD decomposition: false positives of its labels and transfer of adversarial masks"
requires-python = "==3.13.*"
dependencies = [
    # The earlier project's harness, used as a library (never its analysis commands, which guard its own tree).
    "vpd-audit",
    # The authors' library, the submodule the harness itself carries at 74146b5.
    "param-decomp",
    "modal",
    "pyyaml",
    "numpy",
    "torch",
]

[tool.uv.sources]
vpd-audit = { path = "third_party/vpd-audit", editable = true }
param-decomp = { path = "third_party/vpd-audit/third_party/param-decomp", editable = true }

[tool.uv]
# Every registry package pinned to the version in third_party/vpd-audit/uv.lock at b6d3bac, so this
# environment is the one the earlier project's numbers were measured in (that lockfile in turn pins
# torch, pydantic, wandb, transformers, datasets, huggingface_hub, and numpy to the authors' own lockfile).
